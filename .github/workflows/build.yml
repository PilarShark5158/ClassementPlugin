name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ClassementPlugin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: ClassementPlugin
          path: ClassementPlugin/target/ClassementPlugin.jar
